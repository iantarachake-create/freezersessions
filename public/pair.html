<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>FREEZER MD | PAIR CODE</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* =========================================
               PREMIUM BLUE & GOLD THEME
            ========================================= */
            --primary: #1769ff;
            --primary-light: #3b82f6;
            --primary-dark: #0b3ea8;

            --gold: #f5c542;
            --gold-light: #ffe27a;
            --gold-dark: #b88900;

            --text: #ffffff;
            --text-light: rgba(255, 255, 255, 0.72);

            --background: #020713;
            --background-2: #06142d;

            --glass: rgba(23, 105, 255, 0.07);
            --glass-strong: rgba(23, 105, 255, 0.14);
            --glass-border: rgba(245, 197, 66, 0.24);

            --success: #35d07f;
            --error: #ff5c5c;

            --shadow:
                0 30px 80px rgba(0, 0, 0, 0.75),
                0 0 55px rgba(23, 105, 255, 0.16),
                0 0 30px rgba(245, 197, 66, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);

            --transition:
                all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Poppins",
                sans-serif;

            background:
                radial-gradient(
                    circle at 12% 10%,
                    rgba(23, 105, 255, 0.30),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 88% 18%,
                    rgba(245, 197, 66, 0.10),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 90%,
                    rgba(23, 105, 255, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 15% 100%,
                    rgba(11, 62, 168, 0.24),
                    transparent 35%
                ),
                var(--background);

            color: var(--text);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            line-height: 1.6;
            padding: 30px 18px;

            overflow-x: hidden;
            position: relative;
        }

        /* =========================================
           INITIAL PAGE LOADER
        ========================================= */

        #page-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(23, 105, 255, 0.16),
                    transparent 45%
                ),
                #020713;

            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;
        }

        #page-loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-content {
            text-align: center;
            position: relative;
        }

        .loader-logo {
            width: 105px;
            height: 105px;
            margin: 0 auto 24px;
            position: relative;
        }

        .loader-logo::before {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 50%;

            background:
                conic-gradient(
                    from 0deg,
                    var(--primary),
                    var(--gold),
                    var(--primary-light),
                    var(--gold-light),
                    var(--primary)
                );

            filter: blur(14px);
            opacity: 0.75;

            animation:
                loaderRing 2.5s linear infinite;
        }

        .loader-logo::after {
            content: "";
            position: absolute;
            inset: -4px;

            border-radius: 50%;

            border:
                2px solid rgba(245, 197, 66, 0.65);

            border-top-color:
                var(--primary-light);

            animation:
                loaderSpin 1.2s linear infinite;
        }

        .loader-logo img {
            width: 100%;
            height: 100%;

            border-radius: 50%;
            object-fit: cover;

            border:
                3px solid rgba(255, 255, 255, 0.2);

            position: relative;
            z-index: 2;

            box-shadow:
                0 0 40px rgba(23, 105, 255, 0.45),
                0 0 20px rgba(245, 197, 66, 0.18);
        }

        .loader-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 3px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    var(--gold-light),
                    #ffffff
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            margin-bottom: 8px;
        }

        .loader-subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 0.78rem;
            letter-spacing: 1px;
            margin-bottom: 22px;
        }

        .loader-line {
            width: 150px;
            height: 3px;

            margin: auto;

            border-radius: 999px;
            overflow: hidden;

            background:
                rgba(255,255,255,0.08);
        }

        .loader-line span {
            display: block;
            height: 100%;
            width: 35%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--gold),
                    var(--primary)
                );

            animation:
                loadingLine 1.2s ease-in-out infinite;
        }

        @keyframes loaderSpin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes loaderRing {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes loadingLine {
            0% {
                transform: translateX(-150%);
            }

            50% {
                transform: translateX(180%);
            }

            100% {
                transform: translateX(350%);
            }
        }

        /* =========================================
           AMBIENT GLOW
        ========================================= */

        body::before,
        body::after {
            content: "";
            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;
            filter: blur(110px);

            pointer-events: none;
            z-index: -3;
        }

        body::before {
            background:
                rgba(23, 105, 255, 0.25);

            top: -130px;
            left: -120px;

            animation:
                ambientOne 11s ease-in-out infinite alternate;
        }

        body::after {
            background:
                rgba(245, 197, 66, 0.11);

            right: -130px;
            bottom: -130px;

            animation:
                ambientTwo 13s ease-in-out infinite alternate;
        }

        @keyframes ambientOne {
            from {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            to {
                transform:
                    translate(75px, 55px)
                    scale(1.22);
            }
        }

        @keyframes ambientTwo {
            from {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            to {
                transform:
                    translate(-65px, -45px)
                    scale(1.28);
            }
        }

        /* =========================================
           PARTICLES
        ========================================= */

        .particles {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
            pointer-events: none;

            z-index: -2;
        }

        .particle {
            position: absolute;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    var(--gold-light),
                    var(--primary)
                );

            box-shadow:
                0 0 15px rgba(23, 105, 255, 0.7),
                0 0 8px rgba(245, 197, 66, 0.5);

            animation:
                float linear infinite;
        }

        @keyframes float {
            0% {
                transform:
                    translateY(110vh)
                    scale(0.5);

                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 0.65;
            }

            100% {
                transform:
                    translateY(-120vh)
                    rotate(360deg)
                    scale(1);

                opacity: 0;
            }
        }

        /* =========================================
           HOME BUTTON
        ========================================= */

        .home-btn {
            position: fixed;

            top: 22px;
            right: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(23, 105, 255, 0.18),
                    rgba(245, 197, 66, 0.07)
                );

            color: white;

            padding: 12px 20px;

            border-radius: 999px;

            font-weight: 600;
            text-decoration: none;

            border:
                1px solid var(--glass-border);

            backdrop-filter:
                blur(25px)
                saturate(170%);

            -webkit-backdrop-filter:
                blur(25px)
                saturate(170%);

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255,255,255,0.16);

            z-index: 100;

            display: flex;
            align-items: center;
            gap: 8px;

            transition: var(--transition);
        }

        .home-btn i {
            color: var(--gold);
        }

        .home-btn:hover {
            transform:
                translateY(-3px)
                scale(1.02);

            background:
                linear-gradient(
                    135deg,
                    rgba(23, 105, 255, 0.32),
                    rgba(245, 197, 66, 0.15)
                );

            border-color:
                rgba(245, 197, 66, 0.7);

            box-shadow:
                0 18px 45px rgba(23, 105, 255, 0.35),
                0 0 25px rgba(245, 197, 66, 0.10);
        }

        /* =========================================
           MAIN GLASS CONTAINER
        ========================================= */

        .container {
            width: 100%;
            max-width: 480px;

            padding: 40px 32px;

            text-align: center;

            position: relative;

            border-radius: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(23, 105, 255, 0.12),
                    rgba(2, 7, 19, 0.78)
                );

            border:
                1px solid var(--glass-border);

            backdrop-filter:
                blur(35px)
                saturate(180%);

            -webkit-backdrop-filter:
                blur(35px)
                saturate(180%);

            box-shadow: var(--shadow);

            overflow: hidden;

            animation:
                containerIn
                0.9s
                cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Gold top glow */
        .container::before {
            content: "";

            position: absolute;

            top: -45%;
            left: -40%;

            width: 180%;
            height: 90%;

            background:
                linear-gradient(
                    120deg,
                    rgba(255,255,255,0.13),
                    transparent 35%,
                    transparent 62%,
                    rgba(245,197,66,0.10)
                );

            transform: rotate(-12deg);

            pointer-events: none;
        }

        .container::after {
            content: "";

            position: absolute;

            inset: 1px;

            border-radius: 31px;

            border-top:
                1px solid rgba(255,255,255,0.18);

            pointer-events: none;
        }

        @keyframes containerIn {
            from {
                opacity: 0;
                transform:
                    translateY(35px)
                    scale(0.95);
                filter: blur(5px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
                filter: blur(0);
            }
        }

        /* =========================================
           LOGO
        ========================================= */

        .logo {
            width: 110px;
            height: 110px;

            margin: 0 auto 22px;

            position: relative;
            z-index: 2;
        }

        .logo::before {
            content: "";

            position: absolute;

            inset: -9px;

            border-radius: 50%;

            background:
                conic-gradient(
                    from 0deg,
                    var(--primary),
                    var(--gold),
                    var(--primary-light),
                    var(--gold-light),
                    var(--primary)
                );

            filter: blur(14px);

            opacity: 0.72;

            animation:
                logoGlow 5s linear infinite;
        }

        .logo::after {
            content: "";

            position: absolute;

            inset: -4px;

            border-radius: 50%;

            border:
                2px solid rgba(245,197,66,0.45);

            border-left-color:
                var(--primary-light);

            animation:
                logoSpin 4s linear infinite;
        }

        .logo img {
            position: relative;

            width: 100%;
            height: 100%;

            border-radius: 50%;

            object-fit: cover;

            border:
                3px solid rgba(245,197,66,0.48);

            box-shadow:
                0 15px 40px rgba(0,0,0,0.55),
                0 0 25px rgba(23,105,255,0.25),
                inset 0 0 20px rgba(245,197,66,0.16);

            animation:
                logoFloat 4s ease-in-out infinite;

            z-index: 2;
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        @keyframes logoGlow {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes logoSpin {
            to {
                transform: rotate(-360deg);
            }
        }

        /* =========================================
           HEADING
        ========================================= */

        h1 {
            position: relative;
            z-index: 2;

            margin-bottom: 10px;

            font-size: 2.1rem;
            font-weight: 850;

            letter-spacing: -0.6px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 10%,
                    #dbeafe 42%,
                    var(--gold-light) 72%,
                    var(--gold) 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 30px rgba(23,105,255,0.16);
        }

        p {
            position: relative;
            z-index: 2;

            color: var(--text-light);

            margin-bottom: 25px;

            font-size: 0.98rem;
        }

        p strong {
            color: var(--gold-light);
        }

        /* =========================================
           FORM
        ========================================= */

        .form-group {
            margin-bottom: 22px;

            text-align: left;

            position: relative;
            z-index: 2;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: 650;

            color:
                rgba(255,255,255,0.9);

            font-size: 0.9rem;
        }

        .input-container {
            position: relative;
        }

        .input-container i {
            position: absolute;

            left: 18px;
            top: 50%;

            transform:
                translateY(-50%);

            color: var(--gold);

            z-index: 3;

            font-size: 1.1rem;

            filter:
                drop-shadow(
                    0 0 7px
                    rgba(245,197,66,0.35)
                );
        }

        input[type="text"] {
            width: 100%;

            padding:
                16px
                16px
                16px
                50px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,0,0,0.42),
                    rgba(23,105,255,0.06)
                );

            color: white;

            font-size: 1rem;

            outline: none;

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,0.07),
                0 8px 25px
                rgba(0,0,0,0.22);

            transition: var(--transition);
        }

        input[type="text"]::placeholder {
            color:
                rgba(255,255,255,0.36);
        }

        input[type="text"]:focus {
            border-color:
                rgba(245,197,66,0.75);

            background:
                rgba(23,105,255,0.10);

            box-shadow:
                0 0 0 4px
                rgba(23,105,255,0.16),

                0 12px 35px
                rgba(23,105,255,0.25),

                0 0 20px
                rgba(245,197,66,0.08),

                inset 0 1px 0
                rgba(255,255,255,0.15);
        }

        /* =========================================
           MAIN BUTTON
        ========================================= */

        .btn {
            position: relative;
            z-index: 2;

            width: 100%;

            padding: 16px;

            border:
                1px solid
                rgba(245,197,66,0.55);

            border-radius: 18px;

            cursor: pointer;

            font-size: 1rem;
            font-weight: 800;

            color: #07101f;

            background:
                linear-gradient(
                    135deg,
                    #1769ff 0%,
                    #3b82f6 38%,
                    #f5c542 100%
                );

            box-shadow:
                0 15px 35px
                rgba(23,105,255,0.32),

                0 5px 20px
                rgba(245,197,66,0.13),

                inset 0 1px 0
                rgba(255,255,255,0.45);

            overflow: hidden;

            transition: var(--transition);
        }

        .btn::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.45),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition: 0.7s;
        }

        .btn:hover::before {
            left: 150%;
        }

        .btn:hover {
            transform:
                translateY(-3px)
                scale(1.01);

            box-shadow:
                0 20px 45px
                rgba(23,105,255,0.43),

                0 0 25px
                rgba(245,197,66,0.13),

                inset 0 1px 0
                rgba(255,255,255,0.5);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================================
           RESULT
        ========================================= */

        #result {
            position: relative;
            z-index: 2;

            margin-top: 22px;

            padding: 24px;

            border-radius: 22px;

            display: none;

            animation:
                resultIn
                0.55s
                ease-out;

            text-align: center;

            font-weight: 500;

            background:
                linear-gradient(
                    145deg,
                    rgba(23,105,255,0.15),
                    rgba(0,0,0,0.43)
                );

            border:
                1px solid
                rgba(245,197,66,0.25);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,0.1),

                0 15px 40px
                rgba(0,0,0,0.3);
        }

        @keyframes resultIn {
            from {
                opacity: 0;
                transform:
                    translateY(15px)
                    scale(0.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        #result p {
            margin-bottom: 8px;
        }

        /* =========================================
           PAIR CODE
        ========================================= */

        #pair-code {
            display: inline-block;

            font-size: 1.8rem;
            font-weight: 850;

            color: var(--gold-light);

            margin:
                10px 0
                15px;

            padding:
                12px 22px;

            letter-spacing: 4px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,0,0,0.58),
                    rgba(23,105,255,0.08)
                );

            border:
                1px solid
                rgba(245,197,66,0.45);

            box-shadow:
                0 10px 30px
                rgba(23,105,255,0.20),

                0 0 18px
                rgba(245,197,66,0.08),

                inset 0 1px 0
                rgba(255,255,255,0.1);

            animation:
                codeGlow
                2.5s
                ease-in-out
                infinite alternate;
        }

        @keyframes codeGlow {
            from {
                box-shadow:
                    0 10px 25px
                    rgba(23,105,255,0.18),

                    0 0 10px
                    rgba(245,197,66,0.05),

                    inset 0 1px 0
                    rgba(255,255,255,0.1);
            }

            to {
                box-shadow:
                    0 10px 40px
                    rgba(23,105,255,0.35),

                    0 0 22px
                    rgba(245,197,66,0.18),

                    inset 0 1px 0
                    rgba(255,255,255,0.2);
            }
        }

        /* =========================================
           LOADING SPINNER
        ========================================= */

        #loading-spinner {
            display: none;
            margin: 25px 0;
        }

        .spinner {
            width: 45px;
            height: 45px;

            margin: 0 auto;

            border:
                3px solid
                rgba(255,255,255,0.10);

            border-top:
                3px solid var(--gold);

            border-right:
                3px solid var(--primary-light);

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;

            box-shadow:
                0 0 25px
                rgba(23,105,255,0.3),

                0 0 12px
                rgba(245,197,66,0.15);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================
           ACTION BUTTONS
        ========================================= */

        .action-buttons {
            display: flex;
            gap: 12px;

            margin-top: 18px;
        }

        .action-btn {
            flex: 1;

            padding: 14px;

            border-radius: 16px;

            font-weight: 750;

            cursor: pointer;

            text-decoration: none;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 8px;

            transition: var(--transition);
        }

        .copy-btn {
            background:
                linear-gradient(
                    135deg,
                    #1769ff,
                    #3b82f6,
                    #f5c542
                );

            color: #07101f;

            border:
                1px solid
                rgba(255,255,255,0.2);

            box-shadow:
                0 10px 25px
                rgba(23,105,255,0.28);
        }

        .copy-btn:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 14px 30px
                rgba(23,105,255,0.42);
        }

        .back-btn {
            background:
                rgba(255,255,255,0.055);

            color: white;

            border:
                1px solid
                rgba(245,197,66,0.24);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);
        }

        .back-btn i {
            color: var(--gold);
        }

        .back-btn:hover {
            background:
                rgba(23,105,255,0.15);

            transform:
                translateY(-2px);

            border-color:
                rgba(245,197,66,0.55);
        }

        /* =========================================
           MESSAGES
        ========================================= */

        .error-message {
            color: #ff7777;

            margin-top: 8px;

            font-size: 0.85rem;

            display: none;

            animation:
                shake 0.5s;
        }

        .success-message {
            color: var(--success);

            margin-top: 15px;

            display: none;

            font-size: 0.9rem;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            20%, 60% {
                transform: translateX(-5px);
            }

            40%, 80% {
                transform: translateX(5px);
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            body {
                padding:
                    20px 14px;
            }

            .container {
                padding:
                    32px 20px;

                border-radius:
                    28px;
            }

            .container::after {
                border-radius:
                    27px;
            }

            .logo {
                width: 92px;
                height: 92px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .home-btn {
                top: 14px;
                right: 14px;

                padding:
                    9px 15px;

                font-size: 0.85rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            #pair-code {
                font-size: 1.5rem;
            }

            .loader-logo {
                width: 90px;
                height: 90px;
            }
        }

        @media (min-width: 481px) {
            .container {
                margin-top: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                scroll-behavior:
                    auto !important;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         INITIAL LOADING SCREEN
    ========================================= -->

    <div id="page-loader">

        <div class="loader-content">

            <div class="loader-logo">

                <img
                    src="https://files.catbox.moe/2fsb5r.jpg"
                    alt="FREEZER MD"
                >

            </div>

            <div class="loader-title">
                FREEZER MD
            </div>

            <div class="loader-subtitle">
                INITIALIZING PAIR CODE
            </div>

            <div class="loader-line">
                <span></span>
            </div>

        </div>

    </div>


    <!-- Floating background -->
    <div
        class="particles"
        id="particles"
    ></div>


    <!-- Home -->
    <a
        href="./"
        class="home-btn"
    >
        <i class="fas fa-house"></i>
        Home
    </a>


    <!-- Main Glass Card -->
    <div class="container">

        <div class="logo">

            <img
                src="https://files.catbox.moe/2fsb5r.jpg"
                alt="FREEZER MD"
            >

        </div>


        <h1>
            FREEZER PAIR CODE
        </h1>


        <p>
            Enter your WhatsApp number without the
            <strong>+</strong> sign
        </p>


        <div class="form-group">

            <label for="phone-number">
                Phone Number
            </label>


            <div class="input-container">

                <i class="fas fa-mobile-screen-button"></i>

                <input
                    type="text"
                    id="phone-number"
                    placeholder="e.g., 2547xxxxxxxx"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    autocomplete="tel"
                >

            </div>


            <div
                class="error-message"
                id="error-message"
            >
                Please enter a valid phone number
                (10-15 digits)
            </div>

        </div>


        <button
            id="submit"
            class="btn"
        >

            <span id="btn-text">
                <i class="fas fa-link"></i>
                GET CODE
            </span>

            <span
                id="btn-spinner"
                style="display: none;"
            >
                <i class="fas fa-spinner fa-spin"></i>
                GENERATING...
            </span>

        </button>


        <div
            id="loading-spinner"
            class="spinner"
        ></div>


        <!-- Result -->
        <div id="result">

            <p>
                Your pairing code is:
            </p>


            <div id="pair-code"></div>


            <p>
                Enter this code in your WhatsApp
                linked devices
            </p>


            <div class="action-buttons">

                <button
                    id="copy-btn"
                    class="action-btn copy-btn"
                >
                    <i class="fas fa-copy"></i>
                    COPY CODE
                </button>


                <a
                    href="./"
                    class="action-btn back-btn"
                >
                    <i class="fas fa-arrow-left"></i>
                    BACK
                </a>

            </div>


            <div
                class="success-message"
                id="success-message"
            >
                <i class="fas fa-circle-check"></i>
                Code copied to clipboard!
            </div>

        </div>

    </div>


    <!-- Axios -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>


    <script>

        /* =========================================
           PAGE LOADER
        ========================================= */

        window.addEventListener(
            "load",
            () => {

                setTimeout(() => {

                    const loader =
                        document.getElementById(
                            "page-loader"
                        );

                    loader.classList.add("hide");

                }, 900);

            }
        );


        /* =========================================
           FLOATING PARTICLES
        ========================================= */

        function createParticles() {

            const particlesContainer =
                document.getElementById(
                    "particles"
                );

            const particleCount =
                window.innerWidth < 768
                    ? 16
                    : 30;

            for (
                let i = 0;
                i < particleCount;
                i++
            ) {

                const particle =
                    document.createElement("div");

                particle.classList.add(
                    "particle"
                );

                const size =
                    Math.random() * 7 + 3;

                particle.style.width =
                    `${size}px`;

                particle.style.height =
                    `${size}px`;

                particle.style.left =
                    `${Math.random() * 100}%`;

                particle.style.top =
                    `${Math.random() * 100}%`;

                const duration =
                    Math.random() * 15 + 12;

                particle.style.animationDuration =
                    `${duration}s`;

                particle.style.animationDelay =
                    `${Math.random() * 8}s`;

                particle.style.opacity =
                    Math.random() * 0.45 + 0.1;

                particlesContainer.appendChild(
                    particle
                );
            }
        }

        createParticles();


        /* =========================================
           ELEMENTS
        ========================================= */

        const submitButton =
            document.getElementById(
                "submit"
            );

        const phoneNumberInput =
            document.getElementById(
                "phone-number"
            );

        const resultDiv =
            document.getElementById(
                "result"
            );

        const pairCodeDiv =
            document.getElementById(
                "pair-code"
            );

        const copyButton =
            document.getElementById(
                "copy-btn"
            );

        const errorMessage =
            document.getElementById(
                "error-message"
            );

        const successMessage =
            document.getElementById(
                "success-message"
            );

        const btnText =
            document.getElementById(
                "btn-text"
            );

        const btnSpinner =
            document.getElementById(
                "btn-spinner"
            );

        const loadingSpinner =
            document.getElementById(
                "loading-spinner"
            );


        /* =========================================
           PHONE VALIDATION
        ========================================= */

        function validatePhoneNumber(
            number
        ) {

            const cleaned =
                number.replace(
                    /\D/g,
                    ""
                );

            return (
                cleaned.length >= 10 &&
                cleaned.length <= 15
            );
        }


        /* =========================================
           GET PAIR CODE
        ========================================= */

        submitButton.addEventListener(
            "click",
            async (e) => {

                e.preventDefault();

                const phoneNumber =
                    phoneNumberInput.value.trim();

                if (
                    !validatePhoneNumber(
                        phoneNumber
                    )
                ) {

                    errorMessage.style.display =
                        "block";

                    errorMessage.style.animation =
                        "shake 0.5s";

                    setTimeout(() => {

                        errorMessage.style.animation =
                            "";

                    }, 500);

                    return;
                }


                errorMessage.style.display =
                    "none";


                btnText.style.display =
                    "none";

                btnSpinner.style.display =
                    "inline-block";

                submitButton.disabled =
                    true;


                try {

                    /*
                     * ORIGINAL API ENDPOINT
                     * MAINTAINED
                     */

                    const { data } =
                        await axios.get(
                            `/code?number=${phoneNumber}`
                        );


                    const code =
                        data.code ||
                        "ERROR";


                    pairCodeDiv.textContent =
                        code;


                    resultDiv.style.display =
                        "block";


                    resultDiv.scrollIntoView({
                        behavior: "smooth",
                        block: "nearest"
                    });


                } catch (error) {

                    pairCodeDiv.textContent =
                        "SERVICE ERROR";

                    resultDiv.style.display =
                        "block";

                    console.error(
                        "Error:",
                        error
                    );


                } finally {

                    btnText.style.display =
                        "inline-block";

                    btnSpinner.style.display =
                        "none";

                    submitButton.disabled =
                        false;
                }

            }
        );


        /* =========================================
           COPY PAIR CODE
        ========================================= */

        copyButton.addEventListener(
            "click",
            () => {

                const code =
                    pairCodeDiv.textContent;


                navigator.clipboard
                    .writeText(code)

                    .then(() => {

                        successMessage.style.display =
                            "block";


                        setTimeout(() => {

                            successMessage.style.display =
                                "none";

                        }, 2000);

                    })

                    .catch(() => {

                        /* Fallback */

                        const textarea =
                            document.createElement(
                                "textarea"
                            );

                        textarea.value =
                            code;

                        document.body.appendChild(
                            textarea
                        );

                        textarea.select();

                        document.execCommand(
                            "copy"
                        );

                        textarea.remove();


                        successMessage.style.display =
                            "block";


                        setTimeout(() => {

                            successMessage.style.display =
                                "none";

                        }, 2000);

                    });

            }
        );


        /* =========================================
           PHONE INPUT
        ========================================= */

        phoneNumberInput.addEventListener(
            "input",
            (e) => {

                e.target.value =
                    e.target.value.replace(
                        /\D/g,
                        ""
                    );


                if (
                    errorMessage.style.display ===
                    "block"
                ) {

                    errorMessage.style.display =
                        "none";

                }

            }
        );


        /* =========================================
           ENTER KEY SUPPORT
        ========================================= */

        phoneNumberInput.addEventListener(
            "keydown",
            (e) => {

                if (
                    e.key === "Enter"
                ) {

                    submitButton.click();

                }

            }
        );

    </script>

</body>
</html>
